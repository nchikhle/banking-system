spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1 # Keeps data alive as long as the app runs
    //url: jdbc:h2:mem:bankdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true # Crucial: See the SQL generated for your transfers

  # This allows you to see the DB in your browser at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
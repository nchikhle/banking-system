services:
  account-service:
    build:
      context: ./account-service   # Go into the subfolder[cite: 1, 2]
      dockerfile: Dockerfile        # Look for the file inside that folder[cite: 1, 2]
    container_name: account-service
    ports:
      - "8081:8081"
      - "5005:5005"  # The debug port
    environment:
      #- SPRING_JPA_DATABASE=POSTGRESQL
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/accounts_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - AUDIT_SERVICE_URL=http://audit-service:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    container_name: transaction-service

    ports:
      - "8082:8082"
    environment:
      #- SPRING_JPA_DATABASE=POSTGRESQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/transactions_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      # This is the "Magic" line: use the container name, not localhost
      - ACCOUNT_SERVICE_URL=http://account-service:8081
    networks:
      - banking-network
    depends_on:
      - account-service

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      #- POSTGRES_DB=accounts_db
      - POSTGRES_PASSWORD=password
      # Notice we removed POSTGRES_DB here so it falls back to your custom script
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Maps your script into Postgres
    networks:
      - banking-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

        # ⚡ THE SPEED FIX: Tell Keycloak not to enforce or validate domain headers locally
        # ⚡ THE ACTUAL FIXED HOSTNAME PAIR FOR LOCAL DEV:
        # This forces Keycloak to use whatever domain the incoming browser sent (localhost/127.0.0.1),
        # meaning it won't force-redirect your browser to the internal docker-network addresses!
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      # FORCE Keycloak to issue tokens with "iss": "http://keycloak:8080"
      #KC_HOSTNAME_URL: http://keycloak:8080

      # Keep the Java entropy speed booster active
      JAVA_OPTS_APPEND: "-Djava.security.egd=file:/dev/./urandom"
    volumes:
      - ./keycloak_data:/opt/keycloak/data
    command: start-dev
    networks:
      - banking-network              # ◀ Join the network

networks:
  banking-network:
    driver: bridge
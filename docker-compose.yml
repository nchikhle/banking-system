services:
  account-service:
    build:
      context: ./account-service   # Go into the subfolder[cite: 1, 2]
      dockerfile: Dockerfile        # Look for the file inside that folder[cite: 1, 2]
    container_name: account-service
    ports:
      - "8080:8080"
    environment:
      #- SPRING_DATASOURCE_URL=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
      #- SPRING_DATASOURCE_USERNAME=sa
      #- SPRING_DATASOURCE_PASSWORD=password
      #- SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/accounts_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - banking-network
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=accounts_db
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    networks:
      - banking-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  banking-network:
    driver: bridge